name: Publish npm package

# npm's trusted publisher is bound to this workflow filename.
# Preview installs next, prod installs latest.
#
# Version comes from sdk/node/package.json, not the root VERSION file. Neither
# job commits back to the repo.

on:
  push:
    branches: [main]
    paths:
      - 'sdk/node/**'
      - 'proto/**'
      - '.github/workflows/publish-npm.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  latest:
    name: Publish latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read version
        run: |
          VERSION=$(node -p "require('./sdk/node/package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read version from sdk/node/package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "::notice::Publishing @astropods/messaging@$VERSION"

      - name: Install dependencies
        run: bun install
        working-directory: sdk/node

      - name: Build
        run: bun run build
        working-directory: sdk/node

      - name: Test
        run: bun test
        working-directory: sdk/node

      - name: Check if version is already published
        id: check-published
        run: |
          if npm view "@astropods/messaging@${{ env.VERSION }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ env.VERSION }} is already published on npm — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check-published.outputs.published == 'false'
        run: npm publish --access public
        working-directory: sdk/node

  next:
    name: Publish next
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A prerelease of the next patch sorts above latest, and the eventual
      # stable release sorts above it. Keyed on the commit, so a re-run is a
      # no-op rather than a new version.
      - name: Derive next version
        run: |
          BASE=$(node -p "require('./sdk/node/package.json').version")
          BUMPED=$(node -p "const [a,b,c]='${BASE}'.split('.'); [a,b,Number(c)+1].join('.')")
          echo "NEXT_VERSION=${BUMPED}-next.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "::notice::next channel ${BUMPED}-next.${GITHUB_SHA:0:7}, stable is ${BASE}"

      - name: Install dependencies
        run: bun install
        working-directory: sdk/node

      - name: Build
        run: bun run build
        working-directory: sdk/node

      - name: Test
        run: bun test
        working-directory: sdk/node

      - name: Check if version is already published
        id: check-published
        run: |
          if npm view "@astropods/messaging@${{ env.NEXT_VERSION }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ env.NEXT_VERSION }} is already published, nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The bump stays on the runner; main keeps the stable version.
      - name: Publish
        if: steps.check-published.outputs.published == 'false'
        working-directory: sdk/node
        run: |
          npm version "${{ env.NEXT_VERSION }}" --no-git-tag-version
          npm publish --access public --tag next
          echo "::notice::Published @astropods/messaging@${{ env.NEXT_VERSION }} as next"
