name: "Maintenance: Renovate"

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A PR opened with GITHUB_TOKEN does not trigger workflows, so Renovate's PRs would sit with no checks.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@v46.3.11
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: 'astro-ci-bot[bot] <266831336+astro-ci-bot[bot]@users.noreply.github.com>'
          LOG_LEVEL: info
        with:
          token: ${{ steps.app-token.outputs.token }}
